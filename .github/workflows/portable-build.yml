name: Build Portable Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Create portable package
        run: |
          mkdir -p dist-portable
          copy dist/* dist-portable/
          copy INSTALLER_READY.txt dist-portable/
          copy README.md dist-portable/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribuidora-san-martin-portable
          path: dist-portable/
